<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Doctor Profile - DocConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="media/logo.jpeg" alt="DocConnect Logo">
            <div class="logo-text">
                <h1><span>Doc</span> Connect</h1>
                <p>LINKING PATIENTS & PHYSICIANS</p>
            </div>
        </div>
        <nav class="navbar">
            <ul class="nav-menu">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <div class="appointment-container" style="max-width: 600px; margin: 50px auto;">
            <h2>Complete Your Doctor Profile</h2>
            <p style="margin-bottom: 20px; color: #666;">Please provide your professional details to start receiving appointments.</p>
            
            <form id="doctorProfileForm">
                <label for="specialization">Specialization*</label>
                <input type="text" id="specialization" placeholder="e.g. Cardiologist, Dermatologist" required>
                
                <label for="experience">Years of Experience*</label>
                <input type="number" id="experience" placeholder="e.g. 10" required>
                
                <label for="fees">Consultation Fees (₹)*</label>
                <input type="number" id="fees" placeholder="e.g. 500" required>
                
                <h3 style="margin: 20px 0 10px;">Weekly Availability</h3>
                <div id="availabilityContainer">
                    <div class="availability-row" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                        <select class="avail-day" style="flex: 1;">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                        <input type="text" class="avail-slots" placeholder="e.g. 10:00 AM, 11:00 AM" style="flex: 2;" required>
                    </div>
                </div>
                <button type="button" id="addDayBtn" style="background: #eee; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer; margin-bottom: 20px;">+ Add Another Day</button>

                <button type="submit" class="appointment-btn" style="width: 100%; border: none; cursor: pointer;">Save Profile</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
