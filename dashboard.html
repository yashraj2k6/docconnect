<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DocConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .appointments-table {
            width: 100%;
            border-collapse: collapse;
        }
        .appointments-table th, .appointments-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .appointments-table th {
            background-color: #f8f9fa;
            color: #333;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-booked { background: #e3f2fd; color: #1976d2; }
        .status-completed { background: #e8f5e9; color: #2e7d32; }
        .status-cancelled { background: #ffebee; color: #c62828; }
        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 0.8rem;
        }
        .btn-complete { background: #4caf50; color: white; }
        .btn-cancel { background: #f44336; color: white; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo" style="text-decoration: none;">
            <img src="media/logo.jpeg" alt="DocConnect Logo">
            <div class="logo-text">
                <h1><span>Doc</span> Connect</h1>
                <p>LINKING PATIENTS & PHYSICIANS</p>
            </div>
        </a>
        <nav class="navbar">
            <ul class="nav-menu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="doctors.html">Doctor</a>
                <a href="reviews.html">Reviews</a>
                <a href="appointment.html">Book Appointment</a>
                <a href="contact.html">Contact</a>
            </ul>
        </nav>
    </header>

    <main>
        <div class="dashboard-container">
            <div class="dashboard-header">
                <h2 id="welcomeUser">Welcome, User</h2>
                <span id="userRole" class="status-badge status-booked">Patient</span>
            </div>

            <h3>My Appointments</h3>
            <table class="appointments-table">
                <thead>
                    <tr id="tableHeader">
                        <th>Doctor/Patient</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="appointmentsList">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Review Modal -->
    <div id="reviewModal" class="form1">
        <div class="form1-content" style="max-width: 500px;">
            <span class="close-btn" id="closeReviewModal">&times;</span>
            <div class="form1-header">
                <h3>Rate Your Experience</h3>
            </div>
            <form id="reviewForm" class="form1-form">
                <input type="hidden" id="reviewAppointmentId">
                <label>Rating (1-5 Stars)</label>
                <div class="star-rating" style="font-size: 2rem; color: #f39c12; cursor: pointer; margin-bottom: 15px;">
                    <span class="star" data-value="1">☆</span>
                    <span class="star" data-value="2">☆</span>
                    <span class="star" data-value="3">☆</span>
                    <span class="star" data-value="4">☆</span>
                    <span class="star" data-value="5">☆</span>
                </div>
                <input type="hidden" id="ratingValue" value="0" required>
                
                <label>Your Feedback</label>
                <textarea id="reviewComment" placeholder="How was your visit?" rows="4" required></textarea>

                <button type="submit" class="submit-btn" style="background-color: #1976d2; color: white;">Submit Review</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
